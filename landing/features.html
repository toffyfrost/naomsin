<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ฟีเจอร์ทั้งหมด · N'AOMSIN</title>
<meta name="description" content="คู่มือฟีเจอร์ทั้งหมดของน้องออมสิน พร้อมวิธีใช้และภาพหน้าจอจริง สำหรับเพื่อนใน LINE">
<meta name="theme-color" content="#E3F0FF">
<link rel="icon" type="image/png" sizes="32x32" href="img/brand/favicon-32.png">
<link rel="apple-touch-icon" href="img/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg:#050A18; --bg2:#0A1430; --panel:rgba(255,255,255,.04); --stroke:rgba(255,255,255,.09);
    --ink:#EAF1FF; --sub:#94A6C6; --dim:#5C6F92;
    --blue:#1C7ED6; --blue2:#4DABF7; --sky:#A5D8FF; --mint:#63E6BE; --line-green:#06C755;
    --glow:0 0 0 1px rgba(77,171,247,.25),0 30px 80px -20px rgba(28,126,214,.55);
    --head:'IBM Plex Sans Thai','Noto Sans Thai',sans-serif;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; overflow-x:clip; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans Thai',sans-serif; font-size:17px; line-height:1.7; overflow-x:clip; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  img { max-width:100%; display:block; }
  .wrap { max-width:1200px; margin:0 auto; padding:0 24px; }
  h1,h2,h3 { font-family:var(--head); font-weight:700; letter-spacing:-.01em; margin:0; }
  .grad { background:linear-gradient(100deg,#fff 10%,var(--sky) 45%,var(--blue2) 80%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--blue2); }
  .eyebrow::before { content:""; width:24px; height:1px; background:currentColor; }

  .btn { display:inline-flex; align-items:center; gap:10px; padding:14px 28px; border-radius:999px; font-weight:600; font-size:16px; transition:.25s; border:0; cursor:pointer; }
  .btn.pri { background:linear-gradient(135deg,var(--blue),var(--blue2)); color:#fff; box-shadow:0 10px 30px -8px rgba(28,126,214,.7); }
  .btn.pri:hover { transform:translateY(-2px); box-shadow:0 16px 40px -8px rgba(28,126,214,.9); }
  .btn.ghost { color:var(--ink); border:1px solid var(--stroke); background:var(--panel); }
  .btn.ghost:hover { border-color:rgba(77,171,247,.5); }

  /* progress + nav */
  #progress { position:fixed; top:0; left:0; height:2px; width:0; background:linear-gradient(90deg,var(--blue),var(--mint)); z-index:50; }
  header { position:fixed; top:0; left:0; right:0; z-index:40; transition:.3s; }
  header.solid { background:rgba(5,10,24,.72); backdrop-filter:blur(16px) saturate(1.4); border-bottom:1px solid var(--stroke); }
  header .wrap { display:flex; align-items:center; justify-content:space-between; height:72px; }
  .logo { display:flex; align-items:center; gap:12px; font-family:var(--head); font-weight:700; font-size:19px; letter-spacing:.04em; }
  .logo img { width:38px; height:38px; border-radius:50%; }
  nav.menu { display:flex; gap:32px; font-size:15px; color:var(--sub); }
  nav.menu a:hover { color:#fff; }
  header .btn { padding:10px 20px; font-size:15px; }
  @media (max-width:860px) { nav.menu { display:none; } }
  header { background:rgba(5,10,24,.72); backdrop-filter:blur(16px) saturate(1.4); border-bottom:1px solid var(--stroke); }
  section { position:relative; padding:130px 0 90px; }
  .head { text-align:center; max-width:720px; margin:0 auto 70px; }
  .head h2 { font-size:clamp(34px,4.4vw,56px); line-height:1.2; margin:18px 0 16px; }
  .head p { color:var(--sub); font-weight:300; font-size:18px; margin:0; }
  footer { border-top:1px solid var(--stroke); padding:36px 0; color:var(--dim); font-size:14px; }
  footer .wrap { display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px; }

  /* ผู้ใช้ที่เข้าสู่ระบบ */
  .me { display:none; align-items:center; gap:10px; font-size:14px; color:var(--sub); }
  .me img { width:32px; height:32px; border-radius:50%; }
  .me button { font:inherit; font-size:13px; color:var(--sub); background:none; border:1px solid var(--stroke); border-radius:999px; padding:4px 12px; cursor:pointer; }
  body.ok.has-me .me { display:flex; }
  body.ok .back { display:none; }
  @media (max-width:560px) { .me span { display:none; } }

  /* ประตูเข้าสู่ระบบ */
  .gate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:110px 20px 60px; position:relative; overflow:hidden; }
  .gate::before { content:""; position:absolute; width:620px; height:620px; border-radius:50%; background:#1C7ED6; filter:blur(120px); opacity:.35; top:-200px; right:-160px; }
  .gate-card { position:relative; width:100%; max-width:460px; text-align:center; padding:44px 34px; border-radius:32px; border:1px solid var(--stroke);
               background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015)); backdrop-filter:blur(10px); box-shadow:var(--glow); }
  .gate-card > img { margin:0 auto 22px; }
  .gate-card .g-logo { width:130px; height:130px; border-radius:50%; margin-top:-100px; box-shadow:0 0 0 6px #0A1430,0 20px 50px -10px rgba(232,185,106,.5); }
  .gate-card .g-mascot { width:170px; height:170px; object-fit:cover; border-radius:28px; margin-top:-110px; box-shadow:0 0 0 6px #0A1430,var(--glow); }
  .gate-card { margin-top:60px; }
  .gate-card h1 { font-size:30px; line-height:1.3; margin:10px 0 12px; }
  .gate-card p { color:var(--sub); font-weight:300; margin:0 0 26px; }
  .gate-card .btn { width:100%; justify-content:center; }
  .btn.line { background:var(--line-green); color:#fff; box-shadow:0 10px 30px -8px rgba(6,199,85,.6); }
  .btn.line:hover { transform:translateY(-2px); }
  .gate-card .btn + .btn { margin-top:10px; }
  .perks { list-style:none; padding:0; margin:0 0 28px; text-align:left; display:grid; gap:10px; font-size:15px; }
  .perks li::before { content:"✓"; color:var(--mint); font-weight:700; margin-right:10px; }
  .step { display:inline-flex; gap:6px; margin-bottom:6px; }
  .step i { width:28px; height:4px; border-radius:2px; background:var(--stroke); }
  .step i.on { background:var(--blue2); }
  .gate small { display:block; color:var(--dim); font-size:13px; margin-top:18px; }
  .spin { width:36px; height:36px; border-radius:50%; border:3px solid var(--stroke); border-top-color:var(--blue2); margin:10px auto; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  body.ok .gate { display:none; }

  /* feature guide */
  .guide .wrap { max-width:1320px; }
  .g-grid { display:grid; grid-template-columns:250px 1fr; gap:64px; align-items:start; }
  .g-nav { position:sticky; top:100px; }
  .gn-sheet-h, .gn-bg, .m-nav { display:none; }
  .gn-g { border-bottom:1px solid var(--stroke); }
  .gn-cat { display:flex; align-items:center; justify-content:space-between; padding:13px 4px; font-size:14px; color:var(--sub); transition:.2s; }
  .gn-cat b { font-weight:600; }
  .gn-cat em { font-style:normal; font-size:12px; color:var(--dim); min-width:24px; height:20px; border-radius:10px; background:var(--panel); display:flex; align-items:center; justify-content:center; }
  .gn-cat:hover { color:#fff; }
  .gn-g.open .gn-cat { color:#fff; }
  .gn-g.open .gn-cat em { background:var(--blue); color:#fff; }
  .gn-items { display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease; }
  .gn-items > div { overflow:hidden; }
  .gn-g.open .gn-items { grid-template-rows:1fr; }
  .gn-items a { display:flex; align-items:center; gap:10px; padding:7px 12px; margin-left:2px; font-size:14.5px; color:var(--sub); border-left:1px solid var(--stroke); transition:.2s; }
  .gn-items a:last-child { margin-bottom:10px; }
  .gn-items a span { width:20px; text-align:center; font-size:14px; }
  .gn-items a:hover { color:#fff; }
  .gn-items a.on { color:#fff; border-left:2px solid var(--blue2); padding-left:11px; background:linear-gradient(90deg,rgba(28,126,214,.16),transparent); }
  .gn-prog { height:2px; background:var(--stroke); border-radius:2px; margin-top:18px; overflow:hidden; }
  .gn-prog i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--blue),var(--mint)); transition:width .3s; }
  .g-cat { font-size:14px; font-weight:600; letter-spacing:.14em; color:var(--blue2); margin:40px 0 18px; padding-bottom:14px; border-bottom:1px solid var(--stroke); scroll-margin-top:100px; }
  .g-cat:first-child { margin-top:0; }
  .fe { display:grid; grid-template-columns:1fr 330px; gap:40px; align-items:start; padding:34px; margin-bottom:22px; border-radius:28px; border:1px solid var(--stroke);
        background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.012)); scroll-margin-top:96px; }
  .fe-n { font-family:var(--head); font-size:13px; color:var(--dim); letter-spacing:.1em; }
  .fe h4 { font-family:var(--head); font-size:26px; font-weight:700; margin:6px 0 12px; display:flex; align-items:center; gap:12px; }
  .pro-tag { margin-left:auto; font-family:var(--head); font-size:11px; font-weight:700; letter-spacing:.1em; color:#fff; padding:3px 10px; border-radius:999px; background:linear-gradient(135deg,var(--blue),#7950F2); }
  .pro-dot { margin-left:auto; font-style:normal; font-size:9.5px; font-weight:700; letter-spacing:.08em; color:var(--sky); border:1px solid rgba(165,216,255,.35); padding:0 6px; border-radius:999px; }
  .fe-ic { width:46px; height:46px; flex:0 0 46px; border-radius:14px; background:rgba(28,126,214,.18); display:flex; align-items:center; justify-content:center; font-size:23px; }
  .fe-d { color:var(--sub); font-weight:300; margin:0 0 22px; }
  .fe-h { font-size:12px; font-weight:600; letter-spacing:.14em; color:var(--blue2); margin:20px 0 10px; }
  .fe-steps { margin:0; padding:0; list-style:none; counter-reset:s; display:grid; gap:10px; }
  .fe-steps li { counter-increment:s; display:flex; gap:12px; font-size:15.5px; }
  .fe-steps li::before { content:counter(s); flex:0 0 24px; height:24px; border-radius:8px; background:var(--panel); border:1px solid var(--stroke); font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center; color:var(--sky); margin-top:2px; }
  .fe-try { display:flex; flex-wrap:wrap; gap:8px; }
  .cmd { font:inherit; font-size:14px; color:#DDEBFF; background:rgba(6,199,85,.1); border:1px solid rgba(6,199,85,.35); padding:6px 14px; border-radius:999px; cursor:pointer; transition:.2s; }
  .cmd:hover { background:rgba(6,199,85,.22); }
  .cmd.ok { background:var(--line-green); color:#fff; }
  .fe-note { font-size:14px; color:var(--sub); background:rgba(255,193,7,.07); border:1px solid rgba(255,193,7,.22); border-radius:12px; padding:10px 14px; margin:20px 0 0; }
  .fe-shot { position:sticky; top:96px; }
  .sh { position:relative; border-radius:26px; overflow:hidden; max-height:600px; background:#8FAAD0; box-shadow:var(--glow); border:6px solid #1A2338; }
  .sh img { display:none; width:100%; }
  .sh img.on { display:block; }
  .sh::after { content:""; position:absolute; left:0; right:0; bottom:0; height:90px; background:linear-gradient(transparent,rgba(5,10,24,.85)); pointer-events:none; }
  .sh-zoom { position:absolute; z-index:2; bottom:14px; left:50%; transform:translateX(-50%); font:inherit; font-size:13px; font-weight:600; color:#fff; background:rgba(28,126,214,.9); border:0; padding:7px 16px; border-radius:999px; cursor:pointer; }
  .fe-shot.wide .sh { max-height:none; background:#fff; }
  .fe-shot.wide .sh::after { display:none; }
  .fe-shot.wide .sh-zoom { bottom:10px; }
  .sh-tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .sh-tabs button { font:inherit; font-size:13px; color:var(--sub); background:var(--panel); border:1px solid var(--stroke); padding:4px 12px; border-radius:999px; cursor:pointer; }
  .sh-tabs button.on { color:#fff; background:var(--blue); border-color:var(--blue); }
  .lb { position:fixed; inset:0; z-index:100; background:rgba(3,6,15,.88); backdrop-filter:blur(8px); display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:40px 16px; }
  .lb[hidden] { display:none; }
  .lb-in img { width:min(420px,100%); border-radius:20px; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .lb-in img.wide { width:min(900px,100%); }
  .lb-x { position:fixed; top:18px; right:18px; width:44px; height:44px; border-radius:50%; border:1px solid var(--stroke); background:rgba(255,255,255,.08); color:#fff; font-size:18px; cursor:pointer; }
  @media (max-width:1100px) { .fe { grid-template-columns:1fr 280px; gap:28px; padding:26px; } }
  @media (max-width:900px) {
    .g-grid { grid-template-columns:1fr; gap:0; }
    .m-nav { display:flex; align-items:center; gap:12px; position:sticky; top:84px; z-index:20; width:100%; margin:0 0 22px; padding:10px 14px; font:inherit; color:var(--ink); text-align:left; cursor:pointer;
             background:rgba(12,20,44,.82); backdrop-filter:blur(16px) saturate(1.4); border:1px solid var(--stroke); border-radius:18px; box-shadow:0 14px 34px -14px rgba(0,0,0,.7); overflow:hidden; }
    .m-ic { width:36px; height:36px; flex:0 0 36px; border-radius:11px; background:rgba(28,126,214,.2); display:flex; align-items:center; justify-content:center; font-size:18px; }
    .m-t { flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3; }
    .m-t small { font-size:11px; color:var(--blue2); letter-spacing:.08em; }
    .m-t b { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .m-n { font-size:12px; color:var(--dim); }
    .m-chev { color:var(--sub); font-size:13px; }
    .m-bar { position:absolute; left:0; bottom:0; height:2px; width:0; background:linear-gradient(90deg,var(--blue),var(--mint)); transition:width .3s; }
    .g-nav { position:fixed; left:0; right:0; bottom:0; top:auto; z-index:60; max-height:78vh; display:flex; flex-direction:column; background:#0B1330; border-radius:26px 26px 0 0;
             border-top:1px solid var(--stroke); padding:8px 20px calc(16px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .35s cubic-bezier(.2,.8,.2,1); box-shadow:0 -30px 60px rgba(0,0,0,.6); }
    .g-nav::before { content:""; width:40px; height:4px; border-radius:2px; background:var(--stroke); margin:4px auto 6px; flex:0 0 auto; }
    body.nav-open .g-nav { transform:none; }
    .gn-sheet-h { display:flex; align-items:center; justify-content:space-between; padding:6px 0 10px; font-family:var(--head); font-size:18px; }
    .gn-x { width:34px; height:34px; border-radius:50%; border:1px solid var(--stroke); background:var(--panel); color:var(--sub); cursor:pointer; }
    .gn-list { overflow-y:auto; scrollbar-width:none; overscroll-behavior:contain; }
    .gn-list::-webkit-scrollbar { display:none; }
    .gn-items { grid-template-rows:1fr; }
    .gn-items a { padding:10px 12px; font-size:15px; }
    .gn-prog { display:none; }
    .gn-bg { display:block; position:fixed; inset:0; z-index:55; background:rgba(3,6,15,.6); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .3s; }
    body.nav-open .gn-bg { opacity:1; pointer-events:auto; }
    body.nav-open { overflow:hidden; }
    .fe { grid-template-columns:1fr; padding:24px 20px; border-radius:24px; gap:22px; }
    .fe h4 { font-size:22px; }
    .fe-shot { position:static; max-width:320px; margin:0 auto; width:100%; }
    .sh { max-height:460px; }
    .g-cat { margin:32px 0 14px; }
    .g-cat, .fe { scroll-margin-top:160px; }
  }


  /* ===================== ธีมสว่าง ฟ้า–ขาว (ทับค่าด้านบน) ===================== */
  :root {
    --bg:#F5F9FF; --bg2:#EAF4FF; --panel:#FFFFFF; --stroke:rgba(28,126,214,.14);
    --ink:#0B2545; --sub:#4A6485; --dim:#8196B0;
    --blue:#1C7ED6; --blue2:#339AF0; --sky:#1864AB; --mint:#0CA678; --line-green:#06C755;
    --glow:0 0 0 1px rgba(28,126,214,.10),0 28px 60px -24px rgba(24,100,171,.38);
    --card-shadow:0 1px 2px rgba(11,37,69,.05),0 16px 40px -22px rgba(24,100,171,.30);
    --sky-grad:linear-gradient(135deg,#1864AB 0%,#1C7ED6 45%,#4DABF7 100%);
  }
  body { background:radial-gradient(1100px 520px at 90% -8%,rgba(77,171,247,.30),transparent 60%),linear-gradient(180deg,#E3F0FF 0,#F5F9FF 600px,#FFFFFF 100%); background-color:#F5F9FF; }
  .grad { background:linear-gradient(100deg,#1864AB 0%,#1C7ED6 45%,#4DABF7 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .eyebrow { color:var(--blue); }
  .btn.ghost { background:#fff; color:var(--blue); border:1px solid rgba(28,126,214,.28); }
  header { background:rgba(255,255,255,.88); box-shadow:0 8px 30px -18px rgba(24,100,171,.35); }
  .me button { background:#fff; }
  footer { background:#fff; }

  /* ประตูเข้าสู่ระบบ */
  .gate::before { background:#74C0FC; opacity:.45; }
  .gate-card { background:linear-gradient(160deg,#FFFFFF,#F2F8FF); border-color:rgba(28,126,214,.14); box-shadow:0 40px 80px -36px rgba(24,100,171,.5); }
  .gate-card .g-logo { box-shadow:0 0 0 6px #fff,0 20px 50px -10px rgba(232,185,106,.55); }
  .gate-card .g-mascot { box-shadow:0 0 0 6px #fff,0 24px 50px -18px rgba(24,100,171,.55); }
  .perks li { color:var(--ink); }
  .step i { background:rgba(28,126,214,.16); } .step i.on { background:var(--sky-grad); }

  /* คู่มือ */
  .gn-cat:hover, .gn-g.open .gn-cat { color:var(--blue); }
  .gn-cat em { background:#EAF4FF; color:var(--sky); }
  .gn-g.open .gn-cat em { background:var(--sky-grad); color:#fff; }
  .gn-items a { color:var(--sub); border-left-color:rgba(28,126,214,.16); }
  .gn-items a:hover { color:var(--blue); }
  .gn-items a.on { color:var(--sky); font-weight:600; border-left-color:var(--blue); background:linear-gradient(90deg,#E7F2FD,transparent); }
  .gn-prog { background:rgba(28,126,214,.12); }
  .g-cat { color:var(--blue); border-bottom-color:rgba(28,126,214,.16); }
  .fe { background:#fff; border-color:rgba(28,126,214,.10); box-shadow:var(--card-shadow); }
  .fe-n { color:var(--blue2); }
  .fe-ic { background:linear-gradient(135deg,#E7F2FD,#D0EBFF); }
  .fe-h { color:var(--blue); }
  .fe-steps li::before { background:var(--sky-grad); border:0; color:#fff; }
  .cmd { color:#087F5B; background:#EBFBEE; border-color:rgba(6,199,85,.35); }
  .cmd:hover { background:#D3F9D8; }
  .fe-note { color:#8A5A00; background:#FFF9DB; border-color:rgba(250,176,5,.35); }
  .pro-tag { background:linear-gradient(135deg,#1C7ED6,#7950F2); }
  .pro-dot { color:var(--blue); border-color:rgba(28,126,214,.35); }
  .sh { border-color:#fff; box-shadow:0 0 0 1px rgba(28,126,214,.14),0 28px 60px -28px rgba(24,100,171,.55); }
  .sh::after { background:linear-gradient(transparent,rgba(255,255,255,.92)); }
  .sh-tabs button { background:#fff; color:var(--sub); border-color:rgba(28,126,214,.18); }
  .sh-tabs button.on { background:var(--sky-grad); color:#fff; border-color:transparent; }
  .lb { background:rgba(11,37,69,.55); }
  .lb-x { background:#fff; color:var(--ink); }
  @media (max-width:900px) {
    .m-nav { background:rgba(255,255,255,.94); border-color:rgba(28,126,214,.16); box-shadow:0 14px 34px -16px rgba(24,100,171,.45); }
    .m-ic { background:linear-gradient(135deg,#E7F2FD,#D0EBFF); }
    .m-t small { color:var(--blue); }
    .g-nav { background:#fff; box-shadow:0 -30px 60px rgba(11,37,69,.18); }
    .g-nav::before { background:rgba(28,126,214,.2); }
    .gn-x { background:#F2F8FF; }
    .gn-bg { background:rgba(11,37,69,.35); }

  <div class="fe-txt">
    <div class="fe-n">31</div>
    <h4><span class="fe-ic">🔒</span>บัญชีและความปลอดภัย</h4>
    <p class="fe-d">ข้อมูลการเงินเข้ารหัสก่อนบันทึก ดูโควตา AI ที่เหลือของวัน สัปดาห์ และเดือน แก้ข้อมูลส่วนตัว หรือลบบัญชีพร้อมข้อมูลทั้งหมดได้ทุกเมื่อ</p>
    <div class="fe-h">วิธีใช้</div>
    <ol class="fe-steps"><li>พิมพ์ &quot;ข้อมูลของฉัน&quot; ดูหรือแก้ข้อมูล</li><li>พิมพ์ &quot;การใช้ AI&quot; ดูโควตา</li><li>พิมพ์ &quot;ลบบัญชี&quot; เพื่อลบข้อมูลทั้งหมด</li></ol>
    <div class="fe-h">ลองพิมพ์</div><div class="fe-try"><button class="cmd" title="คัดลอก">ข้อมูลของฉัน</button><button class="cmd" title="คัดลอก">การใช้ AI</button><button class="cmd" title="คัดลอก">ลบบัญชี</button></div>
    
  </div>
  <div class="fe-shot"><div class="sh"><img class="on" src="img/chat/chat-account.webp" alt="บัญชีและความปลอดภัย: โควตาการใช้ AI" loading="lazy"><button class="sh-zoom" aria-label="ดูภาพเต็ม">⤢ ดูเต็ม</button></div></div>

<div class="lb" id="lb" hidden><button class="lb-x" aria-label="ปิด">✕</button><div class="lb-in"><img alt=""></div></div>
</template>

<footer>
  <div class="wrap"><div><b style="color:var(--ink)">N'AOMSIN</b> · ผู้ช่วยจดรายรับรายจ่าย</div><div>© 2026 N'AOMSIN. All rights reserved.</div></div>
</footer>

<script>
// ===== ตั้งค่า: ใส่ค่าจาก LINE Developers =====
const CONFIG = {
  liffId: '2011746996-cr2woi9j',        // LIFF app ที่อยู่ใต้ LINE Login channel ซึ่งผูกกับ OA ของน้องออมสิน
  oaBasicId: '@943axyqp',    // Basic ID ของ LINE OA (ขึ้นต้นด้วย @)
};

(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const card = $('#gateCard');
  const addFriendUrl = 'https://line.me/R/ti/p/' + encodeURIComponent(CONFIG.oaBasicId);
  const icon = '<img class="g-logo" src="img/brand/logo.webp" alt="N\'AOMSIN">';
  const mascot = '<img class="g-mascot" src="img/mascot/hello.webp" alt="น้องออมสินโบกมือชวนเพิ่มเพื่อน">';
  const steps = (n) => '<div class="step">' + [1, 2].map((i) => '<i class="' + (i <= n ? 'on' : '') + '"></i>').join('') + '</div>';

  function gate(state, err) {
    if (state === 'login') card.innerHTML = icon + steps(1) +
      '<h1>ดูฟีเจอร์ทั้งหมด<br><span class="grad">ฟรี สำหรับเพื่อนใน LINE</span></h1>' +
      '<p>เข้าสู่ระบบด้วย LINE แล้วเพิ่มเพื่อนน้องออมสิน เพื่อเปิดคู่มือครบทุกฟีเจอร์</p>' +
      '<ul class="perks"><li>31 ฟีเจอร์ พร้อมวิธีใช้ทีละขั้น</li><li>ภาพหน้าจอจากบอทจริง</li><li>คัดลอกคำสั่งไปลองในแชทได้ทันที</li></ul>' +
      '<button class="btn line" id="loginBtn">เข้าสู่ระบบด้วย LINE</button><small>เราใช้แค่ชื่อและรูปโปรไฟล์ LINE ของคุณ</small>';
    if (state === 'friend') card.innerHTML = mascot + steps(2) +
      '<h1>อีกขั้นเดียว!<br><span class="grad">เพิ่มเพื่อนน้องออมสิน</span></h1>' +
      '<p>คู่มือฟีเจอร์เปิดให้เฉพาะเพื่อนของน้องออมสิน เพิ่มเพื่อนแล้วกลับมาที่หน้านี้ได้เลย</p>' +
      '<a class="btn line" href="' + addFriendUrl + '" target="_blank" rel="noopener">➕ เพิ่มเพื่อนใน LINE</a>' +
      '<button class="btn ghost" id="recheck">เพิ่มแล้ว ตรวจอีกครั้ง</button><small>หลังเพิ่มเพื่อน ทักน้องออมสินเพื่อสมัครสมาชิกและเริ่มจดได้เลย</small>';
    if (state === 'error') card.innerHTML = icon + '<h1>เปิดหน้านี้ไม่สำเร็จ</h1><p>' + (err || 'ลองใหม่อีกครั้งนะคะ') + '</p><button class="btn pri" onclick="location.reload()">ลองใหม่</button>';
    if (state === 'loading') card.innerHTML = '<div class="spin"></div>';
    $('#loginBtn')?.addEventListener('click', () => liff.login({ redirectUri: location.href.split('#')[0] }));
    $('#recheck')?.addEventListener('click', checkFriend);
  }

  async function checkFriend() {
    gate('loading');
    try {
      const f = await liff.getFriendship();
      if (f.friendFlag) return unlock(await liff.getProfile());
      gate('friend');
    } catch (e) { gate('error', 'ตรวจสอบการเป็นเพื่อนไม่ได้ (' + (e.message || e) + ')'); }
  }

  function unlock(profile) {
    $('#content').appendChild($('#guideTpl').content.cloneNode(true));
    document.body.classList.add('ok');
    if (profile) {
      document.body.classList.add('has-me');
      $('#me img').src = profile.pictureUrl || 'img/brand/avatar-64.png';
      $('#me span').textContent = profile.displayName;
    }
    initGuide();
    syncFeatureTiers();
    if (location.hash) $(location.hash)?.scrollIntoView();
  }

  async function syncFeatureTiers() {
    try {
      const res = await fetch('https://ihgdueeaslmfkbdaxqlm.supabase.co/functions/v1/naomsin/pricing?v=' + Math.floor(Date.now() / 30000));
      if (!res.ok) return;
      const data = await res.json();
      const ids = { voice: 'voice', question: 'ask', report: 'report', export: 'export', goals: 'goal', recurring: 'card', coach: 'coach', shop: 'shop', wallet_multi: 'wallet', tax: 'tax' };
      for (const f of data.features || []) {
        const id = ids[f.id]; if (!id) continue;
        const article = $('#f-' + id), nav = $('#gnav a[data-f="' + id + '"]');
        for (const el of [article?.querySelector('.fe-txt h4'), nav]) {
          if (!el) continue;
          el.querySelectorAll('.pro-tag,.pro-dot').forEach((tag) => tag.remove());
          if (f.tier === 'pro') { const tag = document.createElement(el === nav ? 'i' : 'span'); tag.className = el === nav ? 'pro-dot' : 'pro-tag'; tag.textContent = 'PRO'; el.appendChild(tag); }
        }
      }
    } catch { /* คงป้ายค่าเริ่มต้นเมื่อราคาไม่พร้อม */ }
  }

  $('#logout').addEventListener('click', () => { if (window.liff && liff.isLoggedIn()) liff.logout(); location.reload(); });
  // กลับมาจากแอป LINE หลังเพิ่มเพื่อน → ตรวจใหม่อัตโนมัติ
  document.addEventListener('visibilitychange', () => { if (!document.hidden && $('#recheck')) checkFriend(); });

  async function start() {
    // ดูตัวอย่างบนเครื่องตัวเอง: http://localhost:8766/features.html?preview
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).has('preview')) return unlock(null);
    if (!window.liff) return gate('error', 'โหลด LINE SDK ไม่ได้ ตรวจการเชื่อมต่ออินเทอร์เน็ต');
    if (/^YOUR_/.test(CONFIG.liffId)) return gate('error', 'ยังไม่ได้ตั้งค่า LIFF ID ในหน้านี้');
    try {
      await liff.init({ liffId: CONFIG.liffId });
      if (!liff.isLoggedIn()) return gate('login');
      await checkFriend();
    } catch (e) { gate('error', 'เข้าสู่ระบบ LINE ไม่สำเร็จ (' + (e.message || e) + ')'); }
  }

  function initGuide() {
  // คู่มือฟีเจอร์: ไฮไลต์เมนูตามหัวข้อที่อ่านอยู่ + เปิดเฉพาะหมวดนั้น
  const navLinks = $$('#gnav .gn-items a'), byId = Object.fromEntries(navLinks.map((a) => [a.dataset.f, a]));
  const groups = $$('#gnav .gn-g'), total = navLinks.length;
  function setActive(a) {
    if (!a || a.classList.contains('on')) return;
    navLinks.forEach((x) => x.classList.toggle('on', x === a));
    const g = a.closest('.gn-g'); groups.forEach((x) => x.classList.toggle('open', x === g));
    const i = navLinks.indexOf(a) + 1, pct = (i / total * 100) + '%';
    $('#gnBar').style.width = pct; $('#mBar').style.width = pct;
    $('#mIc').textContent = a.querySelector('span').textContent;
    $('#mName').textContent = a.textContent.replace(a.querySelector('span').textContent, '');
    $('#mCat').textContent = $('.gn-cat b', g).textContent;
    $('#mNum').textContent = i + '/' + total;
  }
  const spy = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) setActive(byId[e.target.id.slice(2)]); }), { rootMargin: '-40% 0px -55% 0px' });
  $$('.fe').forEach((f) => spy.observe(f));
  setActive(navLinks[0]);

  // มือถือ: แผ่นรายการฟีเจอร์เลื่อนขึ้นจากด้านล่าง
  const openNav = (on) => document.body.classList.toggle('nav-open', on);
  $('#mNav').addEventListener('click', () => { openNav(true); $('#gnav .gn-items a.on')?.scrollIntoView({ block: 'nearest' }); });
  $('#gnClose').addEventListener('click', () => openNav(false));
  $('#gnBg').addEventListener('click', () => openNav(false));
  // กดเมนู → ปิดแผ่น แล้วเลื่อนไปหัวข้อ และจัดตำแหน่งซ้ำหลังรูปด้านบนโหลดเสร็จ (กันเลื่อนคลาดเพราะรูป lazy)
  $$('#gnav a').forEach((a) => a.addEventListener('click', (e) => {
    const t = $(a.getAttribute('href')); if (!t) return;
    e.preventDefault(); openNav(false); history.replaceState(null, '', a.getAttribute('href'));
    const go = () => t.scrollIntoView({ behavior: 'instant', block: 'start' });
    requestAnimationFrame(go);
    const imgs = $$('.fe img').filter((im) => !im.complete && (t.compareDocumentPosition(im) & Node.DOCUMENT_POSITION_PRECEDING));
    imgs.forEach((im) => { im.loading = 'eager'; im.addEventListener('load', go, { once: true }); });
    setTimeout(go, 700);
  }));
  addEventListener('keydown', (e) => { if (e.key === 'Escape') openNav(false); });

  // กดคำสั่งเพื่อคัดลอก
  $$('.cmd').forEach((b) => b.addEventListener('click', async () => {
    const t = b.textContent.replace(/^วาง: /, '').replace(/^"|"$/g, '');
    try { await navigator.clipboard.writeText(t); } catch (e) { return; }
    const old = b.textContent; b.textContent = '✓ คัดลอกแล้ว'; b.classList.add('ok');
    setTimeout(() => { b.textContent = old; b.classList.remove('ok'); }, 1400);
  }));

  // สลับภาพในแต่ละฟีเจอร์
  $$('.sh-tabs').forEach((tabs) => tabs.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    [...tabs.children].forEach((x) => x.classList.toggle('on', x === b));
    $$('img', tabs.nextElementSibling).forEach((img, i) => img.classList.toggle('on', i === +b.dataset.i));
  }));

  // ดูภาพเต็ม
  const lb = $('#lb'), lbImg = $('img', lb);
  const closeLb = () => { lb.hidden = true; document.body.style.overflow = ''; };
  $$('.sh').forEach((sh) => sh.addEventListener('click', () => {
    const img = $('img.on', sh); lbImg.src = img.src; lbImg.alt = img.alt;
    lbImg.classList.toggle('wide', sh.parentElement.classList.contains('wide'));
    lb.hidden = false; lb.scrollTop = 0; document.body.style.overflow = 'hidden';
  }));
  lb.addEventListener('click', (e) => { if (e.target !== lbImg) closeLb(); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && !lb.hidden) closeLb(); });
  }

  start();
})();
</script>
