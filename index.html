<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C7ED6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N'AOMSIN">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>N'AOMSIN · แดชบอร์ด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --brand:#1C7ED6; --brand-soft:#E7F2FD; --bg:#F4F8FD; --card:#fff; --ink:#1F2937; --sub:#6B7280; --muted:#9CA3AF;
          --line:#E2EAF3; --inc:#0D9488; --inc-soft:#E6F6F4; --danger:#DC2626; --seg:#EEF3F9; --plain:#F3F4F6; --track:#E6EEF7;
          --topbg:rgba(244,248,253,.92); color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root { --brand-soft:#16304A; --bg:#0F141A; --card:#18202A; --ink:#F4F4F5; --sub:#B4B4BC; --muted:#8A8A94; --line:#2A3542;
            --inc:#2DD4BF; --inc-soft:#12302D; --danger:#F87171; --seg:#212B37; --plain:#222A33; --track:#2A3646;
            --topbg:rgba(15,20,26,.9); color-scheme:dark; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans Thai',sans-serif; font-size:15px; }
  body { padding-bottom:84px; }
  .top { position:sticky; top:0; z-index:5; background:var(--topbg); backdrop-filter:blur(8px);
         padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between; }
  .top h1 { font-size:17px; margin:0; font-weight:700; }
  .wrap { padding:0 16px; max-width:560px; margin:0 auto; }
  .card { background:var(--card); border-radius:18px; padding:16px; margin:12px 0; box-shadow:0 1px 2px rgba(28,126,214,.06),0 6px 20px rgba(28,126,214,.05); }
  .row { display:flex; align-items:center; gap:10px; }
  .between { justify-content:space-between; }
  .muted { color:var(--muted); font-size:12px; } .sub { color:var(--sub); font-size:13px; }
  .big { font-size:32px; font-weight:700; letter-spacing:-.5px; }
  .h2 { font-size:17px; font-weight:700; margin:0 0 10px; }
  .pos { color:var(--inc); } .neg { color:var(--brand); } .danger { color:var(--danger); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mini { border-radius:14px; padding:12px; }
  .mini .v { font-size:19px; font-weight:700; margin-top:2px; }
  .bar { height:7px; background:var(--track); border-radius:4px; overflow:hidden; margin-top:6px; }
  .bar > i { display:block; height:100%; border-radius:4px; background:var(--brand); }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:11px; font-weight:600; color:#fff; }
  .chip { display:inline-flex; align-items:center; gap:4px; padding:6px 12px; border-radius:999px; background:var(--card); color:var(--ink); border:1px solid var(--line);
          font-size:13px; cursor:pointer; white-space:nowrap; }
  .chip.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .seg { display:flex; background:var(--seg); border-radius:12px; padding:4px; }
  .seg button { flex:1; border:0; background:transparent; padding:8px; border-radius:9px; font:inherit; font-size:14px; color:var(--sub); cursor:pointer; }
  .seg button.on { background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  select, input { font:inherit; font-size:15px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); width:100%; }
  label { font-size:12px; color:var(--sub); display:block; margin:10px 0 4px; }
  .btn { border:0; border-radius:12px; padding:12px 14px; font:inherit; font-weight:600; cursor:pointer; background:var(--brand); color:#fff; width:100%; }
  .btn.ghost { background:var(--brand-soft); color:var(--brand); }
  .btn.plain { background:var(--plain); color:var(--ink); }
  .btn.sm { width:auto; padding:7px 12px; font-size:13px; }
  .list-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .list-item:last-child { border-bottom:0; }
  .ico { width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--brand-soft); font-size:18px; flex:0 0 38px; }
  .grow { flex:1; min-width:0; } .ellipsis { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .amt { font-weight:700; white-space:nowrap; }
  .day { display:flex; justify-content:space-between; font-size:12px; color:var(--sub); margin:16px 2px 4px; }
  .dot { width:10px; height:10px; border-radius:50%; flex:0 0 10px; }
  .kv { display:flex; justify-content:space-between; padding:6px 0; font-size:14px; } .kv b { font-weight:600; }
  nav { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); display:flex; z-index:10;
        padding:6px 4px calc(6px + env(safe-area-inset-bottom)); }
  nav button { flex:1; border:0; background:none; font:inherit; font-size:11px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
  nav button svg { width:23px; height:23px; stroke:currentColor; fill:none; stroke-width:1.8; }
  nav button.on { color:var(--brand); font-weight:600; }
  .fab { position:fixed; right:18px; bottom:88px; width:54px; height:54px; border-radius:50%; background:var(--brand); color:#fff; border:0;
         font-size:28px; box-shadow:0 8px 20px rgba(28,126,214,.35); z-index:9; cursor:pointer; }
  .sheet-bg { position:fixed; inset:0; background:rgba(15,23,42,.35); z-index:20; display:none; }
  .sheet { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-radius:22px 22px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
           z-index:21; max-height:88vh; overflow:auto; transform:translateY(105%); transition:transform .22s ease; max-width:560px; margin:0 auto; }
  .sheet.open { transform:none; }
  .toast { position:fixed; left:50%; top:16px; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:12px;
           font-size:14px; z-index:30; display:none; max-width:90%; }
  .loading { text-align:center; padding:60px 0; color:var(--sub); }
  .hero { background:linear-gradient(135deg,var(--brand),#5AB0F0); color:#fff; }
  .hero .muted, .hero .sub { color:#DDEEFD; }
  .stack { display:flex; height:12px; border-radius:6px; overflow:hidden; margin:10px 0 4px; background:var(--track); }
  .avatar { width:44px; height:44px; border-radius:50%; background:var(--brand-soft); color:var(--brand); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; }
  .badge { background:#FFF4E5; color:#B45309; border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; }
  .empty { text-align:center; color:var(--muted); padding:28px 0; font-size:14px; }
  .del { color:var(--danger); background:none; border:0; font:inherit; font-size:13px; cursor:pointer; }

  /* ---------- Landing page (เปิดเว็บโดยไม่มีลิงก์จาก LINE) ---------- */
  body.lp-on { padding-bottom:0; }
  body.lp-on nav, body.lp-on .fab, body.lp-on .top { display:none !important; }
  .lp { --w:1120px; overflow-x:hidden; }
  .lp a { color:inherit; text-decoration:none; }
  .lp-in { max-width:var(--w); margin:0 auto; padding:0 16px; }
  .lp-head { position:sticky; top:0; z-index:5; background:var(--topbg); backdrop-filter:blur(8px); }
  .lp-head .lp-in { display:flex; align-items:center; justify-content:space-between; height:60px; }
  .lp-logo { display:flex; align-items:center; gap:8px; font-weight:700; font-size:17px; }
  .lp-logo img { width:32px; height:32px; border-radius:9px; }
  .lp-line { text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; background:#06C755; color:#fff !important; font-weight:700;
             border-radius:999px; padding:12px 22px; font-size:15px; box-shadow:0 8px 22px rgba(6,199,85,.28); white-space:nowrap; }
  .lp-line.sm { padding:8px 14px; font-size:13px; box-shadow:none; }
  .lp-line svg { width:20px; height:20px; fill:#fff; flex:0 0 20px; }
  .lp-hero { display:grid; grid-template-columns:1.1fr .9fr; gap:40px; align-items:center; padding:56px 0 40px; }
  .lp-hero h1 { font-size:clamp(30px,5.2vw,54px); line-height:1.2; margin:0 0 14px; font-weight:700; letter-spacing:-.5px; }
  .lp-hero h1 em { font-style:normal; color:var(--brand); }
  .lp-hero p { font-size:clamp(15px,1.8vw,18px); color:var(--sub); line-height:1.7; margin:0 0 24px; max-width:34em; }
  .lp-cta { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .lp-note { font-size:13px; color:var(--muted); }
  .lp-phone { justify-self:center; width:min(320px,100%); background:var(--card); border-radius:30px; padding:16px; box-shadow:0 20px 60px rgba(28,126,214,.16); }
  .lp-bub { max-width:85%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.5; margin:8px 0; }
  .lp-bub.me { margin-left:auto; background:#06C755; color:#fff; border-bottom-right-radius:4px; }
  .lp-bub.bot { background:var(--brand-soft); border-bottom-left-radius:4px; }
  .lp-sec { padding:44px 0; }
  .lp-sec h2 { font-size:clamp(22px,3.4vw,32px); text-align:center; margin:0 0 8px; }
  .lp-sec .lp-lead { text-align:center; color:var(--sub); margin:0 auto 28px; max-width:36em; }
  .lp-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .lp-card { background:var(--card); border-radius:18px; padding:20px; border:1px solid var(--line); }
  .lp-card .e { font-size:28px; } .lp-card h3 { margin:8px 0 6px; font-size:17px; } .lp-card p { margin:0; color:var(--sub); font-size:14px; line-height:1.6; }
  .lp-steps { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; counter-reset:s; }
  .lp-step { text-align:center; padding:8px; } .lp-step b { display:inline-flex; width:40px; height:40px; border-radius:50%; background:var(--brand); color:#fff;
             align-items:center; justify-content:center; font-size:18px; margin-bottom:8px; }
  .lp-step p { color:var(--sub); font-size:14px; margin:4px 0 0; }
  .lp-final { background:var(--brand); color:#fff; border-radius:24px; padding:36px 20px; text-align:center; margin:20px 0 40px; }
  .lp-final h2 { color:#fff; } .lp-final p { opacity:.9; margin:0 0 20px; }
  .lp-qr { display:inline-block; background:#fff; padding:10px; border-radius:14px; margin-top:18px; }
  .lp-qr img { display:block; width:140px; height:140px; }
  .lp-foot { text-align:center; color:var(--muted); font-size:12px; padding:0 0 calc(24px + env(safe-area-inset-bottom)); }
  @media (max-width: 900px) { .lp-grid { grid-template-columns:1fr 1fr; } }
  @media (max-width: 720px) {
    .lp-hero { grid-template-columns:1fr; text-align:center; padding:32px 0 16px; gap:28px; }
    .lp-hero p { margin-left:auto; margin-right:auto; } .lp-cta { justify-content:center; }
    .lp-grid, .lp-steps { grid-template-columns:1fr; } .lp-sec { padding:32px 0; }
    .lp-card { display:grid; grid-template-columns:40px 1fr; column-gap:12px; padding:14px 16px; } .lp-card .e { grid-row:span 2; font-size:26px; }
    .lp-card h3 { margin:0 0 2px; font-size:16px; }
    .lp-qr { display:none; } .lp-cta .lp-line { width:100%; }
  }
  @media (max-width: 360px) { .lp-logo span { display:none; } }
  /* ตัวกรองวันที่: 2 ช่องแบ่งพื้นที่เท่ากัน ไม่ล้นขอบบนมือถือ */
  .daterange { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:8px; }
  input[type=date] { min-width:0; max-width:100%; -webkit-appearance:none; appearance:none; text-align:left; }
  input[type=date]::-webkit-date-and-time-value { text-align:left; }
  /* สถานะกำลังทำงาน: ปุ่มที่กดถูกล็อก + หมุน + แถบโหลด กันกดซ้ำ */
  .spin { width:16px; height:16px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; display:inline-block; animation:sp .7s linear infinite; vertical-align:-3px; margin-right:6px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .is-busy { opacity:.75; cursor:progress !important; pointer-events:none; }
  body.busy button, body.busy .chip, body.busy .list-item, body.busy nav button, body.busy input, body.busy select { pointer-events:none; }
  body.busy .btn:not(.is-busy) { opacity:.55; }
  .busybar { position:fixed; top:0; left:0; right:0; height:3px; z-index:10001; overflow:hidden; display:none; }
  body.busy .busybar { display:block; }
  .busybar i { position:absolute; height:100%; width:40%; background:var(--brand); border-radius:3px; animation:bb 1.1s ease-in-out infinite; }
  @keyframes bb { from { left:-40%; } to { left:100%; } }
</style>
</head>
<body>
<div class="top"><h1 id="title">สรุป</h1><span class="muted" id="rangeLabel"></span></div>
<div class="wrap" id="app"><div class="loading">กำลังโหลด…</div></div>
<button class="fab" id="fab" title="เพิ่มรายการ">+</button>
<nav id="nav"></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="busybar"><i></i></div>

<script>
// ข้อมูลเริ่มต้นมาจากลิงก์ที่บอทส่งให้: ?t=<token>&tab=<แท็บ>&api=<URL Apps Script Web App>
const Q = new URLSearchParams(location.search);
// เปิดจากไอคอนบนหน้าจอโฮม (ไม่มี ?t=) → ใช้ลิงก์ล่าสุดที่เคยเปิด
let SAVED = {}; try { SAVED = JSON.parse(localStorage.getItem('naomsin') || '{}'); } catch (e) {}
const BOOT = { token: Q.get('t') || SAVED.t || '', tab: Q.get('tab') || 'summary', api: Q.get('api') || SAVED.api || '', brand: '#1C7ED6', botName: 'น้องออมสิน' };
if (Q.get('t')) { try { localStorage.setItem('naomsin', JSON.stringify({ t: BOOT.token, api: BOOT.api })); } catch (e) {}
  history.replaceState(null, '', location.pathname); } // ไม่ให้ token ค้างในแถบที่อยู่
// API ต้องเป็น Edge Function ของ Supabase เท่านั้น (กันลิงก์ที่ถูกดัดแปลงให้ส่ง token ไปที่อื่น)
const API_OK = /^https:\/\/[a-z0-9]{20}\.supabase\.co\/functions\/v1\/naomsin\/api$/.test(BOOT.api);
const PALETTE = ['#1C7ED6','#F06595','#F783AC','#E8590C','#FD7E14','#FAB005','#12B886','#15AABF','#4C6EF5','#7950F2','#AE3EC9','#868E96'];
const TABS = [
  ['summary','สรุป','<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'],
  ['analysis','วิเคราะห์','<path d="M5 20V10M12 20V4M19 20v-7"/>'],
  ['budget','หมวด / งบ','<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'],
  ['list','รายการ','<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>'],
  ['settings','ตั้งค่า','<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'],
];
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TYPE_TH = { income:'รายรับ', expense:'รายจ่าย', transfer:'โอน' };
let D = null, tab = BOOT.tab, range = null, charts = [], ui = { listType:'all', q:'', anaSeg:'flow', budSeg:'expense' };

document.documentElement.style.setProperty('--brand', BOOT.brand);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n, dec) => { n = Number(n) || 0; return (n < 0 ? '-' : '') + '฿' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: 2 }); };
const thDate = (ymd) => { const p = ymd.split('-').map(Number); return p[2] + ' ' + TH_M[p[1]-1] + ' ' + String(p[0] + 543).slice(2); };
const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const catColor = (c, list) => PALETTE[Math.max(0, list.indexOf(c)) % PALETTE.length];
const wallet = (id) => (D.settings.wallets.find((w) => w.id === id) || null);

/** ข้อความแจ้งด้านบน · sticky = ค้างไว้จนกว่าจะมีข้อความใหม่ (ใช้ตอนรอ) */
function toast(msg, sticky) {
  const t = $('toast'); t.innerHTML = (sticky ? '<span class="spin"></span>' : '') + esc(msg); t.style.display = 'block';
  clearTimeout(t._h); if (!sticky) t._h = setTimeout(() => t.style.display = 'none', 2600);
}

/* ---------- สถานะกำลังทำงาน: ปุ่มที่กดถูกล็อก + หมุน + แถบโหลด ป้องกันกดซ้ำ ---------- */
let lastBtn = null, busy = false;
document.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) lastBtn = b; }, true);
function setBusy(on, btn) {
  busy = on; document.body.classList.toggle('busy', on);
  if (!btn || !btn.isConnected) return;
  if (on) { btn._html = btn.innerHTML; btn.disabled = true; btn.classList.add('is-busy');
    btn.innerHTML = '<span class="spin"></span>' + (btn.classList.contains('sm') || btn.offsetWidth < 110 ? 'รอสักครู่…' : 'กำลังดำเนินการ…'); }
  else { btn.disabled = false; btn.classList.remove('is-busy'); if (btn._html != null) btn.innerHTML = btn._html; }
}

/** เรียก API บน Supabase · ทุกการกระทำ (บันทึก/ลบ/ส่งออก/เปลี่ยนช่วงวันที่) ล็อกปุ่มและขึ้น "กำลังดำเนินการ" จนเสร็จ */
async function call(fn, ...args) {
  const first = fn === 'dashLoad' && !D; // โหลดครั้งแรกมีหน้า "กำลังโหลด" อยู่แล้ว
  if (!first && busy) { toast('⏳ กำลังดำเนินการรายการก่อนหน้า กรุณารอสักครู่'); throw new Error('busy'); }
  const btn = first ? null : lastBtn;
  if (!first) { setBusy(true, btn); toast(fn === 'dashExport' ? 'กำลังสร้างไฟล์ กรุณารอสักครู่…' : fn === 'dashLoad' ? 'กำลังโหลดข้อมูล…' : 'กำลังดำเนินการ กรุณารอสักครู่…', true); }
  try {
    const res = await fetch(BOOT.api, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ api: fn, t: BOOT.token, args }) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
    if (!first) toast('✅ เรียบร้อย'); // ถ้าฟังก์ชันที่เรียกมีข้อความของตัวเอง จะขึ้นทับทันที
    return j.data;
  } catch (e) {
    toast('⚠️ ' + (e.message === 'Failed to fetch' ? 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้งนะคะ' : (e.message || e)));
    throw e;
  } finally {
    lastBtn = null;
    if (!first) setBusy(false, btn);
  }
}

async function load() {
  try { D = await call('dashLoad', range); } catch (e) { return fatal(e.message || 'โหลดข้อมูลไม่สำเร็จ'); }
  range = D.range;
  render();

function summarize(txs) {
  const s = { income:0, expense:0, byCat:{}, incByCat:{}, count:txs.length };
  txs.forEach((t) => {
    if (t.type === 'transfer') return;
    s[t.type] += t.amount;
    const b = t.type === 'income' ? s.incByCat : s.byCat;
    b[t.category] = (b[t.category] || 0) + t.amount;
  });
  s.net = s.income - s.expense;
  return s;
}
const sorted = (o) => Object.entries(o).sort((a,b) => b[1]-a[1]);

function presets() {
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  return [
    ['cycle','รอบงบนี้', D.cycle.start, D.cycle.end],
    ['month','เดือนนี้', ymd(new Date(y,m,1)), ymd(new Date(y,m+1,0))],
    ['last','เดือนก่อน', ymd(new Date(y,m-1,1)), ymd(new Date(y,m,0))],
    ['7d','7 วัน', ymd(new Date(y,m,n.getDate()-6)), ymd(n)],
    ['year','ปีนี้', y+'-01-01', y+'-12-31'],
  ];
}
function rangeChips() {
  let marked = false; // รอบงบกับเดือนนี้อาจเป็นช่วงเดียวกัน ไฮไลต์แค่อันแรก
  return '<div class="chips" style="margin-top:4px">' + presets().map(([k,l,s,e]) => {
    const on = !marked && range.start === s && range.end === e; if (on) marked = true;
    return `<span class="chip ${on?'on':''}" onclick="setRange('${s}','${e}')">${l}</span>`; }).join('') + '</div>';
}
async function setRange(s, e) { range = { start:s, end:e }; $('app').innerHTML = '<div class="loading">กำลังโหลด…</div>'; await load(); }

    <div class="muted">${left ? 'เหลือ ' + money(left) + (days ? ' · เก็บวันละ ≈' + money(Math.ceil(left/days)) + ' (ถึง ' + thDate(g.deadline) + ')' : '') : '🎉 ครบเป้าแล้ว!'}</div></div>`;
