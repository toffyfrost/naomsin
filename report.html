<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>รายงานการเงิน · N'AOMSIN</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --t900:#0B1B33; --t800:#132B4F; --t700:#1D3E6E; --t600:#2B558F; --t500:#4671A8; --t400:#7294C2; --t300:#A3BAD9; --t200:#CBD8EA; --t100:#E6EDF6; --t50:#F4F7FB; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Noto Sans Thai',sans-serif; color:var(--t900); background:#E9EEF5; font-size:14px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .toolbar { position:sticky; top:0; z-index:5; display:flex; gap:8px; justify-content:center; padding:10px; background:rgba(233,238,245,.92); backdrop-filter:blur(6px); }
  .toolbar button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:10px 18px; cursor:pointer; background:var(--t800); color:#fff; }
  .toolbar .ghost { background:#fff; color:var(--t800); }
  .page { width:210mm; min-height:297mm; margin:12px auto 28px; background:#fff; padding:15mm 15mm 18mm; box-shadow:0 10px 40px rgba(11,27,51,.12); position:relative; }
  .hero { background:var(--t900); color:#fff; border-radius:14px; padding:26px 28px; display:flex; justify-content:space-between; gap:16px; }
  .hero .brand { color:var(--t300); font-weight:700; letter-spacing:2px; font-size:12px; }
  .hero h1 { font-size:34px; line-height:1.15; font-weight:800; margin:4px 0 2px; }
  .hero .en { color:var(--t200); font-size:14px; }
  .hero .right { text-align:right; }
  .hero .period { font-size:19px; font-weight:700; }
  .hero .muted { color:var(--t300); font-size:13px; margin-top:3px; }
  .strip { display:flex; height:6px; margin:0 0 22px; border-radius:0 0 4px 4px; overflow:hidden; }
  .strip i { flex:1; }
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .kpi { border-radius:12px; padding:16px; }
  .kpi .l { font-size:13px; font-weight:700; }
  .kpi .v { font-size:25px; font-weight:800; margin-top:4px; letter-spacing:-.3px; }
  .kpi .d { font-size:12px; margin-top:6px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:0; background:var(--t50); border-radius:12px; margin-top:10px; }
  .stats div { padding:12px 14px; }
  .stats .l { font-size:12px; color:var(--t500); }
  .stats .v { font-size:16px; font-weight:700; margin-top:2px; }
  h2 { font-size:12px; letter-spacing:1.5px; color:var(--t400); font-weight:700; margin:26px 0 0; }
  h3 { font-size:20px; font-weight:800; margin:0 0 10px; }
  .bars .row { display:grid; grid-template-columns:150px 1fr 100px 46px; align-items:center; gap:10px; padding:7px 0; }
  .bars .name { font-size:14px; }
  .bars .track { height:10px; background:var(--t50); border-radius:6px; overflow:hidden; }
  .bars .fill { height:100%; border-radius:6px; }
  .bars .amt { text-align:right; font-weight:700; }
  .bars .pct { text-align:right; color:var(--t400); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { background:var(--t100); color:var(--t600); text-align:left; font-weight:700; padding:9px 10px; font-size:12px; }
  td { padding:8px 10px; border-bottom:1px solid var(--t50); vertical-align:top; }
  tr:nth-child(even) td { background:#FAFBFD; }
  td.r, th.r { text-align:right; white-space:nowrap; }
  td.amt { font-weight:700; }
  tfoot td { background:var(--t900) !important; color:#fff; font-weight:700; }
  .insight { display:flex; border-radius:12px; overflow:hidden; }
  .insight .bar { width:5px; background:var(--t600); }
  .insight .body { background:var(--t50); padding:16px 18px; flex:1; line-height:1.7; font-size:14px; color:var(--t800); white-space:pre-line; }
  .foot { position:absolute; left:15mm; right:15mm; bottom:8mm; text-align:center; font-size:10px; color:var(--t400); }
  .break { break-before:page; page-break-before:always; }
  .loading { text-align:center; padding:120px 20px; color:var(--t500); }
  @media (max-width: 820px) { .page { width:auto; min-height:0; margin:8px; padding:18px; } .hero { flex-direction:column; } .hero .right { text-align:left; }
    .kpis { grid-template-columns:1fr; } .stats { grid-template-columns:1fr 1fr; } .bars .row { grid-template-columns:100px 1fr 80px; } .bars .pct { display:none; } .foot { position:static; margin-top:20px; } }
  @media print { @page { size:A4; margin:0; } body { background:#fff; } .toolbar { display:none; } .page { margin:0; box-shadow:none; width:210mm; min-height:297mm; } }
</style>
</head>
<body>
<div class="toolbar"><button onclick="window.print()">⬇️ บันทึกเป็น PDF</button><button class="ghost" onclick="history.length > 1 ? history.back() : window.close()">ปิด</button></div>
<div id="root"><div class="loading">กำลังสร้างรายงาน…</div></div>
<script>
const Q = new URLSearchParams(location.search);
const T = Q.get('t') || '', API = Q.get('api') || '', START = Q.get('s'), END = Q.get('e'), LABEL = Q.get('l') || '';
const TONES = ['#0B1B33','#132B4F','#1D3E6E','#2B558F','#4671A8','#7294C2','#A3BAD9','#CBD8EA','#E6EDF6'];
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TYPE_TH = { income:'รายรับ', expense:'รายจ่าย', transfer:'โอน' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => '฿' + Math.abs(Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const thDate = (s) => { const p = s.split('-').map(Number); return p[2] + ' ' + TH_M[p[1]-1] + ' ' + (p[0] + 543); };
const mix = (a, b, t) => '#' + [1,3,5].map((i) => Math.round(parseInt(a.substr(i,2),16) + (parseInt(b.substr(i,2),16) - parseInt(a.substr(i,2),16)) * t).toString(16).padStart(2,'0')).join('');
const delta = (cur, prev) => { if (!prev) return 'ไม่มีข้อมูลช่วงก่อน'; const p = (cur - prev) * 100 / Math.abs(prev);
  return Math.abs(p) < .5 ? '● เท่ากับช่วงก่อน' : (p > 0 ? '▲ ' : '▼ ') + Math.abs(p).toFixed(Math.abs(p) >= 10 ? 0 : 1) + '% จากช่วงก่อน'; };

function bars(obj, total) {
  const e = Object.entries(obj).sort((a,b) => b[1]-a[1]), max = e[0]?.[1] || 1;
  return '<div class="bars">' + e.map(([k,v],i) => `<div class="row"><div class="name">${esc(k)}</div>
    <div class="track"><div class="fill" style="width:${Math.max(2, v*100/max)}%;background:${mix('#132B4F','#A3BAD9', e.length>1 ? i/(e.length-1) : 0)}"></div></div>
    <div class="amt">${money(v)}</div><div class="pct">${total ? (v*100/total).toFixed(v*100/total >= 10 ? 0 : 1) : 0}%</div></div>`).join('') + '</div>';
}

async function main() {
  if (!T || !/^https:\/\/[a-z0-9]{20}\.supabase\.co\/functions\/v1\/naomsin\/api$/.test(API)) throw new Error('ลิงก์ไม่ถูกต้อง พิมพ์ "รายงาน PDF" ในแชท LINE เพื่อขอลิงก์ใหม่นะคะ');
  const res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ api:'report', t:T, args:[START, END, LABEL] }) });
  const j = await res.json(); if (!j.ok) throw new Error(j.error);
  const r = j.data, s = r.summary, p = r.previous, days = Math.max(1, Math.round((new Date(END) - new Date(START)) / 864e5) + 1);
  const byDay = {}; r.txs.forEach((t) => { if (t.type === 'expense') byDay[t.date] = (byDay[t.date] || 0) + t.amount; });
  const topDay = Object.entries(byDay).sort((a,b) => b[1]-a[1])[0];
  const top = r.txs.filter((t) => t.type === 'expense').sort((a,b) => b.amount-a.amount).slice(0,5);
  const label = (t) => [t.description, t.merchant].filter(Boolean).join(' · ') || '–';
  document.title = 'รายงานการเงิน ' + (r.period.label || '') + ' · ' + r.name;
  document.getElementById('root').innerHTML = `
  <div class="page">
    <div class="hero"><div><div class="brand">N'AOMSIN</div><h1>รายงานการเงิน</h1><div class="en">Personal Finance Report</div></div>
      <div class="right"><div class="period">${esc(r.period.label || '')}</div><div class="muted">${thDate(START)} – ${thDate(END)}</div><div class="muted" style="margin-top:12px;color:var(--t200)">คุณ${esc(r.name)}</div></div></div>
    <div class="strip">${Array.from({length:24}, (_,i) => `<i style="background:${mix('#0B1B33','#E6EDF6', i/23)}"></i>`).join('')}</div>
    <div class="kpis">
      <div class="kpi" style="background:var(--t800);color:#fff"><div class="l" style="color:var(--t300)">รายรับ</div><div class="v">${money(s.income)}</div><div class="d" style="color:var(--t300)">${delta(s.income,p.income)}</div></div>
      <div class="kpi" style="background:var(--t600);color:#fff"><div class="l" style="color:var(--t200)">รายจ่าย</div><div class="v">${money(s.expense)}</div><div class="d" style="color:var(--t200)">${delta(s.expense,p.expense)}</div></div>
      <div class="kpi" style="background:var(--t100)"><div class="l" style="color:var(--t500)">คงเหลือสุทธิ</div><div class="v">${s.net < 0 ? '−' : ''}${money(s.net)}</div><div class="d" style="color:var(--t500)">${delta(s.net,p.net)}</div></div>
    </div>
    <div class="stats"><div><div class="l">อัตราการออม</div><div class="v">${s.income ? Math.round(s.net*100/s.income) + '%' : '–'}</div></div>
      <div><div class="l">จำนวนรายการ</div><div class="v">${s.count}</div></div><div><div class="l">จ่ายเฉลี่ย/วัน</div><div class="v">${money(Math.round(s.expense/days))}</div></div>
      <div><div class="l">วันที่จ่ายสูงสุด</div><div class="v">${topDay ? thDate(topDay[0]) : '–'}</div></div></div>
    ${s.count ? `
    ${s.expense ? `<h2>EXPENSES</h2><h3>รายจ่ายตามหมวดหมู่</h3>${bars(s.expenseByCat, s.expense)}` : ''}
    ${s.income ? `<h2>INCOME</h2><h3>รายรับตามแหล่งที่มา</h3>${bars(s.incomeByCat, s.income)}` : ''}
    ${top.length ? `<h2>TOP SPENDING</h2><h3>รายจ่ายสูงสุด ${top.length} อันดับ</h3><table><thead><tr><th>#</th><th>วันที่</th><th>รายการ</th><th>หมวดหมู่</th><th class="r">จำนวนเงิน</th></tr></thead>
      <tbody>${top.map((t,i) => `<tr><td>${i+1}</td><td>${thDate(t.date)}</td><td>${esc(label(t))}</td><td>${esc(t.category)}</td><td class="r amt">${money(t.amount)}</td></tr>`).join('')}</tbody></table>` : ''}
    ${r.insight ? `<h2>INSIGHTS</h2><h3>บทวิเคราะห์และคำแนะนำ</h3><div class="insight"><div class="bar"></div><div class="body">${esc(r.insight)}</div></div>` : ''}`
    : '<h3 style="margin-top:30px">ยังไม่มีรายการในช่วงนี้</h3>'}
    <div class="foot">N'AOMSIN Finance · เอกสารข้อมูลส่วนบุคคล · สร้างเมื่อ ${thDate(r.generatedAt)}</div>
  </div>
  ${s.count ? `<div class="page break"><h2 style="margin-top:0">TRANSACTIONS</h2><h3>รายการทั้งหมด ${r.txs.length} รายการ</h3>
    <table><thead><tr><th>วันที่</th><th>ประเภท</th><th>หมวดหมู่</th><th>รายละเอียด</th><th class="r">จำนวนเงิน</th></tr></thead>
    <tbody>${r.txs.map((t) => `<tr><td>${thDate(t.date)}</td><td>${TYPE_TH[t.type]}</td><td>${esc(t.category)}</td><td>${esc(label(t))}</td>
      <td class="r amt" style="color:${t.type==='income'?'var(--t500)':'var(--t800)'}">${t.type==='income'?'+':t.type==='transfer'?'':'−'}${money(t.amount)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="4">คงเหลือสุทธิ</td><td class="r">${s.net < 0 ? '−' : '+'}${money(s.net)}</td></tr></tfoot></table>
    <div class="foot">N'AOMSIN Finance · เอกสารข้อมูลส่วนบุคคล</div></div>` : ''}`;
}
main().catch((e) => { document.getElementById('root').innerHTML = `<div class="loading"><div style="font-size:48px">🔒</div><h3>${esc(e.message)}</h3></div>`; });
</script>
</body>
</html>
