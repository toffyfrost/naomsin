<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>รายงานการเงิน · N'AOMSIN</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* โทนเดียวกับ Landing page: ฟ้า N'AOMSIN + มิ้นต์ */
  :root {
    --ink:#0B2545; --sub:#4A6485; --dim:#8196B0; --line:#E3ECF7; --soft:#F2F7FE; --soft2:#EAF4FF;
    --blue:#1C7ED6; --blue-d:#1864AB; --blue-l:#4DABF7; --sky:#A5D8FF; --mint:#0CA678; --mint-l:#63E6BE; --mint-s:#E6FCF5; --rose:#E8590C;
    --grad:linear-gradient(135deg,#1864AB 0%,#1C7ED6 45%,#4DABF7 100%);
  }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Noto Sans Thai',sans-serif; color:var(--ink); background:#E7EEF8; font-size:13.5px; line-height:1.55;
         -webkit-print-color-adjust:exact; print-color-adjust:exact; -webkit-font-smoothing:antialiased; }
  .toolbar { position:sticky; top:0; z-index:5; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:10px 12px; background:rgba(231,238,248,.94); backdrop-filter:blur(8px); }
  .toolbar button, .toolbar a { font:inherit; font-weight:700; border:0; border-radius:12px; padding:10px 18px; cursor:pointer; background:var(--grad); color:#fff; text-decoration:none; }
  .toolbar .ghost { background:#fff; color:var(--blue-d); }
  .inapp { display:none; max-width:210mm; margin:10px auto 0; padding:12px 16px; border-radius:14px; background:#FFF4E6; color:#8A4B0B; font-size:13px; line-height:1.6; }
  .inapp a { color:var(--blue-d); font-weight:700; }

  .page { width:210mm; min-height:297mm; margin:12px auto 28px; background:#fff; position:relative; overflow:hidden; box-shadow:0 18px 50px -20px rgba(24,100,171,.35); }
  .inner { padding:0 14mm 20mm; }

  /* ---------- ส่วนหัว ---------- */
  .hero { background:var(--grad); color:#fff; padding:11mm 14mm 12mm; position:relative; min-height:56mm; overflow:hidden; }
  .hero:before { content:''; position:absolute; right:-40mm; top:-50mm; width:120mm; height:120mm; border-radius:50%; background:rgba(255,255,255,.08); }
  .hero:after { content:''; position:absolute; left:-20mm; bottom:-45mm; width:90mm; height:90mm; border-radius:50%; background:rgba(99,230,190,.14); }
  .brand { display:flex; align-items:center; gap:10px; position:relative; z-index:1; }
  .brand img { width:44px; height:44px; border-radius:50%; background:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.35); }
  .brand b { font-size:15px; letter-spacing:1.5px; }
  .brand span { display:block; font-size:10.5px; opacity:.8; font-weight:500; letter-spacing:.2px; }
  .hero h1 { font-size:33px; font-weight:800; line-height:1.2; margin-top:7mm; position:relative; z-index:1; }
  .hero .period { display:inline-flex; gap:8px; align-items:center; margin-top:8px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28);
                  padding:5px 14px; border-radius:999px; font-weight:600; font-size:13px; position:relative; z-index:1; }
  .hero .who { margin-top:6px; font-size:12.5px; opacity:.9; position:relative; z-index:1; }
  .hero .mascot { position:absolute; right:12mm; bottom:-3mm; height:58mm; z-index:2; }

  /* ---------- ตัวเลขหลัก ---------- */
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:-7mm; position:relative; z-index:3; }
  .kpi { background:#fff; border-radius:16px; padding:14px 16px; box-shadow:0 1px 2px rgba(11,37,69,.06),0 14px 30px -16px rgba(24,100,171,.35); border-top:4px solid var(--c); }
  .kpi .l { font-size:12px; font-weight:700; color:var(--sub); display:flex; align-items:center; gap:6px; }
  .kpi .l i { width:9px; height:9px; border-radius:50%; background:var(--c); display:inline-block; }
  .kpi .v { font-size:24px; font-weight:800; margin-top:3px; letter-spacing:-.3px; color:var(--c); }
  .kpi .d { font-size:11px; margin-top:3px; color:var(--dim); }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); margin-top:10px; background:var(--soft); border-radius:14px; }
  .stats div { padding:10px 14px; } .stats div + div { border-left:1px solid var(--line); }
  .stats .l { font-size:11px; color:var(--sub); } .stats .v { font-size:15px; font-weight:700; margin-top:1px; }

  /* ---------- หัวข้อ ---------- */
  .sec { margin-top:7mm; }
  .sec-h { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .sec-h .tag { font-size:10px; font-weight:800; letter-spacing:1.6px; color:var(--blue); background:var(--soft2); padding:3px 9px; border-radius:999px; }
  .sec-h h3 { font-size:17px; font-weight:800; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .box { border:1px solid var(--line); border-radius:16px; padding:12px 14px; }

  /* ---------- แท่งหมวด + โดนัท ---------- */
  .cat { display:grid; grid-template-columns:54mm 1fr; gap:8mm; align-items:center; }
  .donut { position:relative; width:50mm; height:50mm; border-radius:50%; }
  .donut:after { content:''; position:absolute; inset:13mm; background:#fff; border-radius:50%; }
  .donut .c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1; text-align:center; }
  .donut .c b { font-size:17px; } .donut .c span { font-size:10.5px; color:var(--sub); }
  .bars .row { display:grid; grid-template-columns:14px 1fr auto 40px; align-items:center; gap:4px 8px; padding:3px 0; border-bottom:1px dashed var(--line); }
  .bars .row:last-child { border-bottom:0; }
  .bars .dot { width:11px; height:11px; border-radius:4px; }
  .bars .name { font-size:13px; } .bars .amt { text-align:right; font-weight:700; } .bars .pct { text-align:right; color:var(--dim); font-size:11.5px; }
  .track { grid-column:2 / 5; height:6px; background:var(--soft); border-radius:6px; overflow:hidden; margin-top:-2px; }
  .track i { display:block; height:100%; border-radius:6px; }

  /* ---------- ตาราง ---------- */
  table { width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px; }
  th { background:var(--soft2); color:var(--blue-d); text-align:left; font-weight:700; padding:8px 10px; font-size:11.5px; }
  th:first-child { border-radius:10px 0 0 10px; } th:last-child { border-radius:0 10px 10px 0; }
  td { padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.r, th.r { text-align:right; white-space:nowrap; } td.amt { font-weight:700; }
  .rank { width:22px; height:22px; border-radius:7px; background:var(--grad); color:#fff; font-weight:800; font-size:11px; display:inline-flex; align-items:center; justify-content:center; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .pill.income { background:var(--mint-s); color:var(--mint); } .pill.expense { background:var(--soft2); color:var(--blue-d); } .pill.transfer { background:#F1F3F5; color:#495057; }
  tfoot td { background:var(--ink); color:#fff; font-weight:700; border:0; }
  tfoot td:first-child { border-radius:10px 0 0 10px; } tfoot td:last-child { border-radius:0 10px 10px 0; }

  /* ---------- บทวิเคราะห์ ---------- */
  .insight { display:grid; grid-template-columns:30mm 1fr; gap:6mm; align-items:center; background:linear-gradient(135deg,#F2F7FE 0%,#E6FCF5 100%); border-radius:18px; padding:12px 16px 12px 8px; }
  .insight img { width:30mm; }
  .insight .body { white-space:pre-line; line-height:1.75; color:var(--ink); font-size:13px; }
  .insight .say { font-weight:800; color:var(--blue-d); margin-bottom:4px; }

  /* ---------- ท้ายหน้า ---------- */
  .foot { position:absolute; left:14mm; right:14mm; bottom:7mm; display:flex; justify-content:space-between; align-items:center; font-size:9.5px; color:var(--dim);
          border-top:1px solid var(--line); padding-top:6px; }
  .foot img { width:16px; height:16px; border-radius:50%; vertical-align:-4px; margin-right:5px; }
  .p2head { background:var(--grad); color:#fff; padding:8mm 14mm; display:flex; justify-content:space-between; align-items:center; margin-bottom:6mm; }
  .p2head b { font-size:17px; } .p2head span { font-size:12px; opacity:.85; }
  .break { break-before:page; page-break-before:always; }
  .loading { text-align:center; padding:120px 20px; color:var(--sub); }
  .loading img { width:120px; }

  @media screen and (max-width: 820px) {
    .page { width:auto; min-height:0; margin:8px; border-radius:18px; } .inner { padding:0 16px 20px; }
    .hero { padding:22px 18px 70px; min-height:0; } .hero h1 { font-size:26px; margin-top:18px; } .hero .mascot { height:150px; right:8px; bottom:0; }
    .kpis { grid-template-columns:1fr; margin-top:-40px; } .stats { grid-template-columns:1fr 1fr; } .stats div + div { border-left:0; }
    .cat, .two, .insight { grid-template-columns:1fr; } .donut { margin:0 auto; } .insight img { width:90px; margin:0 auto; }
    .foot { position:static; margin:20px 16px 0; } .p2head { padding:16px 18px; }
    th:nth-child(3), td:nth-child(3) { display:none; }
  }
  @media print { @page { size:A4; margin:0; } body { background:#fff; } .kpi { box-shadow:none; border:1px solid var(--line); border-top:4px solid var(--c); } .toolbar, .inapp { display:none !important; } .page { margin:0; box-shadow:none; width:210mm; min-height:297mm; border-radius:0; } }
</style>
</head>
<body>
<div class="toolbar"><button onclick="savePdf()">⬇️ บันทึกเป็น PDF</button><button class="ghost" onclick="history.length > 1 ? history.back() : window.close()">ปิด</button></div>
<div class="inapp" id="inapp">📱 เบราว์เซอร์ใน LINE บันทึก PDF ไม่ได้ · <a id="extLink" href="#">แตะที่นี่เพื่อเปิดในเบราว์เซอร์หลัก</a> แล้วกด "บันทึกเป็น PDF" อีกครั้งค่ะ</div>
<div id="root"><div class="loading"><img src="landing/img/mascot/guide.webp" alt=""><div>กำลังสร้างรายงาน…</div></div></div>
<script>
const Q = new URLSearchParams(location.search);
const T = Q.get('t') || '', API = Q.get('api') || '', START = Q.get('s'), END = Q.get('e'), LABEL = Q.get('l') || '';
const LOGO = 'landing/img/brand/logo.webp', MASCOT = 'landing/img/mascot/thumbsup.webp', MASCOT2 = 'landing/img/mascot/guide.webp';
const PALETTE = ['#1864AB','#1C7ED6','#339AF0','#4DABF7','#74C0FC','#0CA678','#20C997','#63E6BE','#FAB005','#F76707','#E64980','#868E96'];
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TYPE_TH = { income:'รายรับ', expense:'รายจ่าย', transfer:'โอน' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n) => '฿' + Math.abs(Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const thDate = (s) => { const p = s.split('-').map(Number); return p[2] + ' ' + TH_M[p[1]-1] + ' ' + (p[0] + 543); };
const pct = (v, t) => t ? (v*100/t >= 10 ? Math.round(v*100/t) : (v*100/t).toFixed(1)) + '%' : '0%';
const delta = (cur, prev) => { if (!prev) return 'ไม่มีข้อมูลช่วงก่อนหน้า'; const p = (cur - prev) * 100 / Math.abs(prev);
  return Math.abs(p) < .5 ? '● เท่ากับช่วงก่อน' : (p > 0 ? '▲ ' : '▼ ') + Math.abs(p).toFixed(Math.abs(p) >= 10 ? 0 : 1) + '% จากช่วงก่อน'; };

// เบราว์เซอร์ใน LINE ดาวน์โหลด/พิมพ์ไม่ได้ → ชวนเปิดในเบราว์เซอร์หลัก
const IN_LINE = /\bLine\//i.test(navigator.userAgent);
const extUrl = () => { const u = new URL(location.href); u.searchParams.set('openExternalBrowser', '1'); return u.toString(); };
if (IN_LINE) { document.getElementById('inapp').style.display = 'block'; document.getElementById('extLink').href = extUrl(); }
function savePdf() { if (IN_LINE) { location.href = extUrl(); return; } window.print(); }

function catBlock(obj, total, label) {
  const e = Object.entries(obj).sort((a,b) => b[1]-a[1]);
  const top = e.slice(0, 7), rest = e.slice(7).reduce((a, x) => a + x[1], 0);
  if (rest) top.push(['อื่นๆ (' + (e.length - 7) + ' หมวด)', rest]);
  let acc = 0;
  const stops = top.map(([, v], i) => { const a = acc; acc += v * 360 / total; return PALETTE[i % PALETTE.length] + ' ' + a + 'deg ' + acc + 'deg'; }).join(',');
  return `<div class="cat"><div class="donut" style="background:conic-gradient(${stops})"><div class="c"><span>${label}</span><b>${money(total)}</b><span>${e.length} หมวด</span></div></div>
    <div class="bars">${top.map(([k, v], i) => `<div class="row"><span class="dot" style="background:${PALETTE[i % PALETTE.length]}"></span><span class="name">${esc(k)}</span>
      <span class="amt">${money(v)}</span><span class="pct">${pct(v, total)}</span><div class="track"><i style="width:${Math.max(2, v*100/top[0][1])}%;background:${PALETTE[i % PALETTE.length]}"></i></div></div>`).join('')}</div></div>`;
}

async function main() {
  if (!T || !/^https:\/\/[a-z0-9]{20}\.supabase\.co\/functions\/v1\/naomsin\/api$/.test(API)) throw new Error('ลิงก์ไม่ถูกต้อง พิมพ์ "รายงาน PDF" ในแชท LINE เพื่อขอลิงก์ใหม่นะคะ');
  const res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ api:'report', t:T, args:[START, END, LABEL] }) });
  const j = await res.json(); if (!j.ok) throw new Error(j.error);
  const r = j.data, s = r.summary, p = r.previous, days = Math.max(1, Math.round((new Date(END) - new Date(START)) / 864e5) + 1);
  const byDay = {}; r.txs.forEach((t) => { if (t.type === 'expense') byDay[t.date] = (byDay[t.date] || 0) + t.amount; });
  const topDay = Object.entries(byDay).sort((a,b) => b[1]-a[1])[0];
  const top = r.txs.filter((t) => t.type === 'expense').sort((a,b) => b.amount-a.amount).slice(0,5);
  const label = (t) => [t.description, t.merchant].filter(Boolean).join(' · ') || '–';
  const saveRate = s.income ? Math.round(s.net*100/s.income) : null;
  const foot = (n) => `<div class="foot"><span><img src="${LOGO}" alt="">N'AOMSIN · ผู้ช่วยจดรายรับรายจ่ายใน LINE</span><span>เอกสารข้อมูลส่วนบุคคล · สร้างเมื่อ ${thDate(r.generatedAt)}</span><span>หน้า ${n}</span></div>`;
  document.title = 'รายงานการเงิน ' + (r.period.label || '') + ' · ' + r.name;
  const sec = (tag, title, body) => `<div class="sec"><div class="sec-h"><span class="tag">${tag}</span><h3>${title}</h3></div>${body}</div>`;
  const expenseSec = s.expense ? sec('EXPENSES', 'รายจ่ายตามหมวดหมู่', catBlock(s.expenseByCat, s.expense, 'รายจ่ายรวม')) : '';
  const topSec = top.length ? sec('TOP ' + top.length, 'รายจ่ายสูงสุด', `<table><thead><tr><th></th><th>วันที่</th><th>รายการ</th><th>หมวดหมู่</th><th class="r">จำนวนเงิน</th></tr></thead>
    <tbody>${top.map((t, i) => `<tr><td><span class="rank">${i + 1}</span></td><td>${thDate(t.date)}</td><td>${esc(label(t))}</td><td>${esc(t.category)}</td><td class="r amt">${money(t.amount)}</td></tr>`).join('')}</tbody></table>`) : '';
  const incomeSec = s.income ? sec('INCOME', 'รายรับตามแหล่งที่มา', catBlock(s.incomeByCat, s.income, 'รายรับรวม')) : '';
  const insightSec = r.insight ? sec('INSIGHTS', 'บทวิเคราะห์และคำแนะนำ',
    `<div class="insight"><img src="${MASCOT2}" alt=""><div><div class="say">น้องออมสินสรุปให้ค่ะ</div><div class="body">${esc(r.insight)}</div></div></div>`) : '';
  const txSec = sec('TRANSACTIONS', 'รายการทั้งหมด ' + r.txs.length + ' รายการ', `<table><thead><tr><th>วันที่</th><th>ประเภท</th><th>หมวดหมู่</th><th>รายละเอียด</th><th class="r">จำนวนเงิน</th></tr></thead>
    <tbody>${r.txs.map((t) => `<tr><td style="white-space:nowrap">${thDate(t.date)}</td><td><span class="pill ${t.type}">${TYPE_TH[t.type]}</span></td><td>${esc(t.category)}</td><td>${esc(label(t))}</td>
      <td class="r amt" style="color:${t.type === 'income' ? 'var(--mint)' : t.type === 'transfer' ? 'var(--sub)' : 'var(--ink)'}">${t.type === 'income' ? '+' : t.type === 'transfer' ? '' : '−'}${money(t.amount)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="4">คงเหลือสุทธิ</td><td class="r">${s.net < 0 ? '−' : '+'}${money(s.net)}</td></tr></tfoot></table>`);
  const empty = `<div class="sec" style="text-align:center"><img src="${MASCOT2}" alt="" style="width:120px"><h3 style="margin-top:8px">ยังไม่มีรายการในช่วงนี้</h3><div style="color:var(--sub)">เริ่มจดในแชท LINE ได้เลยค่ะ</div></div>`;
  // หน้า 1: ภาพรวม + รายจ่ายตามหมวด + Top 5 · หน้า 2 เป็นต้นไป: รายรับ + บทวิเคราะห์ + รายการทั้งหมด
  document.getElementById('root').innerHTML = `
  <div class="page">
    <div class="hero">
      <div class="brand"><img src="${LOGO}" alt=""><div><b>N'AOMSIN</b><span>ตัวช่วยออมเงิน & บันทึกรายจ่าย</span></div></div>
      <h1>รายงานการเงิน</h1>
      <div class="period">📅 ${esc(r.period.label || '')} · ${thDate(START)} – ${thDate(END)}</div>
      <div class="who">จัดทำสำหรับ คุณ${esc(r.name)}</div>
      <img class="mascot" src="${MASCOT}" alt="">
    </div>
    <div class="inner">
      <div class="kpis">
        <div class="kpi" style="--c:var(--mint)"><div class="l"><i></i>รายรับ</div><div class="v">${money(s.income)}</div><div class="d">${delta(s.income, p.income)}</div></div>
        <div class="kpi" style="--c:var(--blue)"><div class="l"><i></i>รายจ่าย</div><div class="v">${money(s.expense)}</div><div class="d">${delta(s.expense, p.expense)}</div></div>
        <div class="kpi" style="--c:${s.net < 0 ? 'var(--rose)' : 'var(--ink)'}"><div class="l"><i></i>คงเหลือสุทธิ</div><div class="v">${s.net < 0 ? '−' : ''}${money(s.net)}</div><div class="d">${delta(s.net, p.net)}</div></div>
      </div>
      <div class="stats"><div><div class="l">อัตราการออม</div><div class="v">${saveRate === null ? '–' : saveRate + '%'}</div></div>
        <div><div class="l">จำนวนรายการ</div><div class="v">${s.count}</div></div><div><div class="l">จ่ายเฉลี่ย/วัน</div><div class="v">${money(Math.round(s.expense / days))}</div></div>
        <div><div class="l">วันที่จ่ายสูงสุด</div><div class="v">${topDay ? thDate(topDay[0]) : '–'}</div></div></div>
      ${s.count ? expenseSec + topSec : empty}
    </div>
    ${foot(1)}
  </div>
  ${s.count ? `<div class="page break">
    <div class="p2head"><div><b>รายละเอียดเพิ่มเติม</b><br><span>${esc(r.period.label || '')} · คุณ${esc(r.name)}</span></div><img src="${LOGO}" alt="" style="width:40px;height:40px;border-radius:50%;background:#fff"></div>
    <div class="inner">${incomeSec}${insightSec}${txSec}</div>
    ${foot('2+')}</div>` : ''}`;
}
main().catch((e) => { document.getElementById('root').innerHTML = `<div class="loading"><img src="${MASCOT2}" alt=""><h3>${esc(e.message)}</h3></div>`; });
</script>
</body>
</html>
